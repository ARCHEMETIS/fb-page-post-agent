name: Publish pending drafts

on:
  push:
    branches:
      - master
    paths:
      - "drafts/pending/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Submit pending drafts
        run: node scripts/submit-pending-drafts.mjs
        env:
          SUBMIT_ENDPOINT: ${{ vars.SUBMIT_ENDPOINT }}
          SUBMIT_DRAFT_SECRET: ${{ secrets.SUBMIT_DRAFT_SECRET }}

      # Commits pushed with the default GITHUB_TOKEN do not trigger another workflow run.
      - name: Commit submitted drafts
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drafts/
          if git diff --cached --quiet; then
            echo "No draft changes to commit."
          else
            git commit -m "Move drafts to submitted"
            git push
          fi
